name: Muse Android CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: muse-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize repaired Muse visual screens
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          python3 -m pip install --quiet pillow
          python3 .github/scripts/materialize-muse-assets.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Lint
        run: gradle --no-daemon :app:lintDebug

      - name: Compile instrumentation tests
        run: gradle --no-daemon :app:assembleDebugAndroidTest

      - name: Assemble debug
        run: gradle --no-daemon :app:assembleDebug

      - name: Assemble release
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK outputs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk
          du -h app/build/outputs/apk/debug/app-debug.apk
          du -h app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Stage APK artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Muse-preview-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/Muse-release-unsigned.apk
          (
            cd dist
            sha256sum Muse-preview-debug.apk Muse-release-unsigned.apk > SHA256SUMS.txt
          )

      - name: Upload Muse APKs
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Muse-APK
          path: |
            dist/Muse-preview-debug.apk
            dist/Muse-release-unsigned.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7


      - name: Record APK delivery status
        if: always()
        run: |
          {
            echo "## Muse APK build"
            echo
            echo "Debug and optimized release APKs were built and verified before the upload step."
            echo "Actions artifact upload is best-effort because repository artifact storage quota is external to the Android build."
            echo "For an installable preview when Actions artifact storage is unavailable, use the separate **Muse Preview APK Release** workflow, which publishes the same verified outputs as GitHub prerelease assets."
          } >> "$GITHUB_STEP_SUMMARY"
