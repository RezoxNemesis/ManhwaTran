name: Muse Preview APK Release

on:
  push:
    branches:
      - feature/muse-foundation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: muse-preview-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard native Muse UI architecture
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/rezoxnemesis/muse/ui/MuseApp.kt
          test -f app/src/main/java/com/rezoxnemesis/muse/ui/MuseBotanicalBackdrop.kt
          test ! -f app/src/main/java/com/rezoxnemesis/muse/ui/MuseExactVisualApp.kt
          test ! -f app/src/main/java/com/rezoxnemesis/muse/ui/MuseReferenceBackdrop.kt
          ! grep -R "MuseExactVisualApp\|MuseExactReferenceSurface" app/src/main/java/com/rezoxnemesis/muse

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Lint
        run: gradle --no-daemon :app:lintDebug

      - name: Compile instrumentation tests
        run: gradle --no-daemon :app:assembleDebugAndroidTest

      - name: Build installable preview APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify optimized release build
        run: gradle --no-daemon :app:assembleRelease

      - name: Stage release files
        run: |
          set -euo pipefail
          mkdir -p dist
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/Muse-0.1.0-preview-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/Muse-0.1.0-release-unsigned.apk
          (
            cd dist
            sha256sum Muse-0.1.0-preview-debug.apk Muse-0.1.0-release-unsigned.apk > SHA256SUMS.txt
          )
          du -h dist/*

      - name: Upload Actions APK artifact when quota permits
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: muse-0.1.0-preview-apk
          path: |
            dist/Muse-0.1.0-preview-debug.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

      - name: Publish latest Muse preview release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: muse-latest-preview
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi
          gh release create "$TAG" \
            dist/Muse-0.1.0-preview-debug.apk \
            dist/Muse-0.1.0-release-unsigned.apk \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Muse Latest Preview" \
            --prerelease \
            --notes "Install Muse-0.1.0-preview-debug.apk for Android testing. This release is rebuilt from the latest feature/muse-foundation commit after unit tests, lint, instrumentation-test compilation, debug assembly and optimized release assembly pass. The unsigned release APK is verification-only. SHA256SUMS.txt contains integrity hashes."
