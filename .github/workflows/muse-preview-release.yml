name: Muse Preview APK Release

on:
  push:
    branches:
      - feature/muse-foundation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: muse-preview-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-preview]')
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify lossless Muse visual atlas
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="app/src/main/assets/muse_reference"
          atlas="/tmp/muse_reference_atlas_lossless.webp"
          set -- "$asset_dir"/muse_reference_atlas_lossless.b64.*
          test "$#" -eq 28
          cat "$asset_dir"/muse_reference_atlas_lossless.b64.* | base64 -d > "$atlas"
          test "$(stat -c%s "$atlas")" -eq 20754098
          printf '%s  %s\n' '23ae0bcbe9edd0149eee3f035046ce4168e5b5d67ea797ac19c4be8c5acc37a1' "$atlas" | sha256sum -c -
          python3 - "$atlas" <<'PY'
          import struct
          import sys

          data = open(sys.argv[1], "rb").read()
          assert data[:4] == b"RIFF" and data[8:12] == b"WEBP"
          pos = 12
          width = height = None
          while pos + 8 <= len(data):
              kind = data[pos:pos + 4]
              size = struct.unpack("<I", data[pos + 4:pos + 8])[0]
              payload = data[pos + 8:pos + 8 + size]
              if kind == b"VP8X":
                  width = 1 + int.from_bytes(payload[4:7], "little")
                  height = 1 + int.from_bytes(payload[7:10], "little")
                  break
              if kind == b"VP8L":
                  assert payload and payload[0] == 0x2F
                  bits = int.from_bytes(payload[1:5], "little")
                  width = (bits & 0x3FFF) + 1
                  height = ((bits >> 14) & 0x3FFF) + 1
                  break
              pos += 8 + size + (size & 1)
          assert (width, height) == (4705, 5016), (width, height)
          print("Verified lossless Muse atlas:", width, height, len(data))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Lint
        run: gradle --no-daemon :app:lintDebug

      - name: Compile instrumentation tests
        run: gradle --no-daemon :app:assembleDebugAndroidTest

      - name: Build installable preview APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify optimized release build
        run: gradle --no-daemon :app:assembleRelease

      - name: Stage release files
        run: |
          set -euo pipefail
          mkdir -p dist
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/Muse-0.1.0-preview-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/Muse-0.1.0-release-unsigned.apk
          (
            cd dist
            sha256sum Muse-0.1.0-preview-debug.apk Muse-0.1.0-release-unsigned.apk > SHA256SUMS.txt
          )
          du -h dist/*

      - name: Upload Actions APK artifact when quota permits
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: muse-0.1.0-preview-apk
          path: |
            dist/Muse-0.1.0-preview-debug.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

      - name: Publish GitHub prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: muse-v0.1.0-preview.1
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG"               dist/Muse-0.1.0-preview-debug.apk               dist/Muse-0.1.0-release-unsigned.apk               dist/SHA256SUMS.txt               --clobber
          else
            gh release create "$TAG"               dist/Muse-0.1.0-preview-debug.apk               dist/Muse-0.1.0-release-unsigned.apk               dist/SHA256SUMS.txt               --target "$GITHUB_SHA"               --title "Muse 0.1.0 Preview 1"               --prerelease               --notes "Install Muse-0.1.0-preview-debug.apk for Android testing. The release-unsigned APK is included only as an optimized/R8 verification output and is not intended for direct installation. SHA256SUMS.txt contains integrity hashes."
          fi
