name: Muse Runtime UI Capture

on:
  push:
    branches:
      - feature/muse-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: muse-runtime-ui-capture
  cancel-in-progress: true

jobs:
  capture-home:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Free runner disk for Android emulator
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Capture Muse Home from running APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            adb wait-for-device
            adb shell settings put system font_scale 1.0
            adb install -r app/build/outputs/apk/debug/app-debug.apk

            # Grant the real runtime media permission so the screenshot shows Muse,
            # not the Android permission/onboarding gate.
            adb shell pm grant com.rezoxnemesis.muse android.permission.READ_MEDIA_AUDIO || true

            # Add one tiny local audio file so runtime Muse exercises its actual
            # local-library path rather than relying only on mock content.
            python3 - <<'PY'
            import math, struct, wave
            rate = 44100
            seconds = 1.0
            with wave.open("Muse_Runtime_Demo.wav", "w") as wav:
                wav.setnchannels(1)
                wav.setsampwidth(2)
                wav.setframerate(rate)
                for i in range(int(rate * seconds)):
                    sample = int(32767 * 0.08 * math.sin(2 * math.pi * 440 * i / rate))
                    wav.writeframesraw(struct.pack("<h", sample))
            PY
            adb shell mkdir -p /sdcard/Music
            adb push Muse_Runtime_Demo.wav /sdcard/Music/Muse_Runtime_Demo.wav
            adb shell am broadcast               -a android.intent.action.MEDIA_SCANNER_SCAN_FILE               -d file:///sdcard/Music/Muse_Runtime_Demo.wav || true

            adb shell am force-stop com.rezoxnemesis.muse
            adb shell am start -W -n com.rezoxnemesis.muse/.MainActivity
            sleep 6

            mkdir -p ui-captures
            adb exec-out screencap -p > ui-captures/muse-home-runtime.png
            test -s ui-captures/muse-home-runtime.png
            file ui-captures/muse-home-runtime.png
            sha256sum ui-captures/muse-home-runtime.png

      - name: Upload genuine runtime screenshot
        uses: actions/upload-artifact@v4
        with:
          name: muse-runtime-ui-home
          path: ui-captures/muse-home-runtime.png
          if-no-files-found: error
          retention-days: 7
