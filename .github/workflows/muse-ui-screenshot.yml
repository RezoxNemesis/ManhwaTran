name: Muse Runtime UI Capture

on:
  push:
    branches:
      - feature/muse-foundation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: muse-runtime-ui-capture
  cancel-in-progress: true

jobs:
  capture-reference-screens:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize stable Muse screen assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 .github/scripts/materialize-muse-assets.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Generate local audio fixture
        run: |
          python3 - <<'PY'
          import math
          import struct
          import wave

          rate = 44100
          seconds = 1.0
          with wave.open("Muse_Runtime_Demo.wav", "w") as wav:
              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(rate)
              frames = bytearray()
              for i in range(int(rate * seconds)):
                  sample = int(32767 * 0.08 * math.sin(2 * math.pi * 440 * i / rate))
                  frames.extend(struct.pack("<h", sample))
              wav.writeframes(bytes(frames))
          PY
          test -s Muse_Runtime_Demo.wav
          file Muse_Runtime_Demo.wav

      - name: Free runner disk for Android emulator
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Capture Muse reference screens from running APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          target: google_apis
          disk-size: 2048M
          ram-size: 2048M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/capture-muse-ui.sh
      - name: Upload genuine runtime screenshots
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: muse-runtime-ui-reference-screens
          path: ui-captures/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Publish captures for review
        run: |
          set -euo pipefail
          mkdir -p /tmp/muse-ui-captures
          cp ui-captures/*.png /tmp/muse-ui-captures/
          rm -rf ui-captures
          git fetch origin muse-ui-captures
          git checkout muse-ui-captures
          mkdir -p ui-captures
          rm -f ui-captures/muse-*-runtime.png
          cp /tmp/muse-ui-captures/*.png ui-captures/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-captures/*.png
          if git diff --cached --quiet; then
            echo "Captures unchanged"
          else
            git commit -m "chore: refresh Muse runtime UI capture set [ui-capture]"
            git push origin muse-ui-captures
          fi
