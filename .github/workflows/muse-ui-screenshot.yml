name: Muse Runtime UI Capture

on:
  push:
    branches:
      - feature/muse-foundation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: muse-runtime-ui-capture
  cancel-in-progress: true

jobs:
  capture-home:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Generate local audio fixture
        run: |
          python3 - <<'PY'
          import math
          import struct
          import wave

          rate = 44100
          seconds = 1.0
          with wave.open("Muse_Runtime_Demo.wav", "w") as wav:
              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(rate)
              frames = bytearray()
              for i in range(int(rate * seconds)):
                  sample = int(32767 * 0.08 * math.sin(2 * math.pi * 440 * i / rate))
                  frames.extend(struct.pack("<h", sample))
              wav.writeframes(bytes(frames))
          PY
          test -s Muse_Runtime_Demo.wav
          file Muse_Runtime_Demo.wav

      - name: Free runner disk for Android emulator
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Capture Muse Home from running APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          target: google_apis
          disk-size: 2048M
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            adb wait-for-device
            adb shell settings put system font_scale 1.0
            adb install -r app/build/outputs/apk/debug/app-debug.apk

            # Grant the real runtime media permission so the screenshot shows Muse,
            # not the Android permission/onboarding gate.
            adb shell pm grant com.rezoxnemesis.muse android.permission.READ_MEDIA_AUDIO || true

            # Push the fixture created before the emulator starts.
            adb shell mkdir -p /sdcard/Music
            adb push Muse_Runtime_Demo.wav /sdcard/Music/Muse_Runtime_Demo.wav
            adb shell am broadcast               -a android.intent.action.MEDIA_SCANNER_SCAN_FILE               -d file:///sdcard/Music/Muse_Runtime_Demo.wav || true

            adb shell am force-stop com.rezoxnemesis.muse
            adb shell am start -W -n com.rezoxnemesis.muse/.MainActivity
            sleep 6

            mkdir -p ui-captures
            adb exec-out screencap -p > ui-captures/muse-home-runtime.png
            test -s ui-captures/muse-home-runtime.png
            file ui-captures/muse-home-runtime.png
            sha256sum ui-captures/muse-home-runtime.png

      - name: Upload genuine runtime screenshot
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: muse-runtime-ui-home
          path: ui-captures/muse-home-runtime.png
          if-no-files-found: error
          retention-days: 7

      - name: Publish capture for review
        run: |
          set -euo pipefail
          cp ui-captures/muse-home-runtime.png /tmp/muse-home-runtime.png
          git fetch origin muse-ui-captures
          git checkout muse-ui-captures
          mkdir -p ui-captures
          cp /tmp/muse-home-runtime.png ui-captures/muse-home-runtime.png
          base64 -w0 ui-captures/muse-home-runtime.png > ui-captures/muse-home-runtime.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-captures/muse-home-runtime.png ui-captures/muse-home-runtime.b64
          if git diff --cached --quiet; then
            echo "Capture unchanged"
          else
            git commit -m "chore: refresh Muse runtime UI capture [ui-capture]"
            git push origin muse-ui-captures
          fi
